<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ user.username }} - Profile</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .navbar {
            background: #1877f2;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            margin: 0;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 18px;
        }

        .profile-container {
            width: 90%;
            max-width: 700px;
            margin: 35px auto;
        }

        .profile-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
            text-align: center;
        }

        .profile-pic {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: #1877f2;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
        }

        .profile-card h1 {
            margin: 5px 0;
        }

        .username {
            color: #777;
            margin-top: 5px;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 70px;
            margin: 25px 0;
        }

        .stats div {
            color: #555;
        }

        .stats strong {
            display: block;
            color: #222;
            font-size: 24px;
            margin-bottom: 5px;
        }

        .edit-btn {
            padding: 10px 22px;
            border: none;
            border-radius: 8px;
            background: #1877f2;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        .posts-section {
            margin-top: 25px;
        }

        .posts-section h2 {
            margin-bottom: 15px;
        }

        .post {
            background: white;
            padding: 18px;
            margin-bottom: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            text-align: left;
        }

        .post p {
            margin: 0;
            line-height: 1.5;
        }

        .no-posts {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            color: #777;
        }

        @media (max-width: 600px) {
            .navbar {
                padding: 15px;
            }

            .navbar a {
                margin-left: 8px;
                font-size: 14px;
            }

            .profile-card {
                padding: 20px;
            }

            .stats {
                gap: 35px;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <div class="navbar">

        <h2>SocialHub</h2>

        <div>
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'logout' %}">Logout</a>
        </div>

    </div>


    <!-- Profile -->
    <div class="profile-container">

        <div class="profile-card">

            <div class="profile-pic">
                👤
            </div>

            <h1>{{ user.username }}</h1>

            <p class="username">@{{ user.username }}</p>


            <!-- Followers / Following -->
            <div class="stats">

                <div>
                    <strong>{{ followers_count }}</strong>
                    Followers
                </div>

                <div>
                    <strong>{{ following_count }}</strong>
                    Following
                </div>

            </div>


            <button class="edit-btn">
                Edit Profile
            </button>

        </div>


        <!-- User Posts -->
        <div class="posts-section">

            <h2>Your Posts 📝</h2>

            {% for post in posts %}

                <div class="post">
                    <p>{{ post.content }}</p>
                </div>

            {% empty %}

                <div class="no-posts">
                    <p>No posts yet. Be the first to create a post! 🎉</p>
                </div>

            {% endfor %}

        </div>

    </div>

</body>
</html>
